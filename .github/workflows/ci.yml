name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, test, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          # Mainnet stays disabled in CI. Contracts are not deployed.
          VITE_ENABLE_MAINNET: "false"

  contracts:
    name: Contracts (compile, test, typecheck, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run typecheck
      - run: npx hardhat coverage
